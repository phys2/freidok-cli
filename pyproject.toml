[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[project]
name = "freidok-cli"
version = "1.2.1"
description = "A command-line client for FreiDok, the publication platform of the University of Freiburg"
authors = [
    { name = "Alexander Haupt", email = "alexander.haupt@physiologie.uni-freiburg.de" }
]
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10,<4"
dependencies = [
    "requests>=2.34.2",
    "pydantic>=1.10.12,<2",
    "python-dotenv>=1.2.2",
    "lxml>=6.1.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "datamodel-code-generator[http]>=0.21.0,<0.22.0",
    "bumpver",
    "ruff",
]

[project.scripts]
freidok = "freidok_cli.cli.run:main"

[project.urls]
repository = "https://github.com/phys2/freidok-cli"

[tool.ruff]
line-length = 88
include = ["*.py", "**/pyproject.toml"]
extend-exclude = ["models"]

[tool.bumpver]
current_version = "1.2.1"
version_pattern = "MAJOR.MINOR.PATCH[PYTAGNUM]"
commit_message = "Bump version to {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    '^version = "{pep440_version}"$',
    '^current_version = "{version}"$',
]
"freidok_cli/version.py" = [
    '^__version__ = "{pep440_version}"$',
]
